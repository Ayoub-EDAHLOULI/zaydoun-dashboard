<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaydoun · Library mobile</title>
<!-- Zaydoun redesign · static design reference. Not production code: rebuild with Next.js + Tailwind v4 + Lucide (see ../README.md). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Amiri:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#0d0d0d}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:#e0c272;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 1720px; background: #070707; color: #f5f0e8; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 32px">

  <!-- Screen 1: library -->
  <div style="position: relative; width: 390px; height: 844px; flex: none; background: #0d0d0d; overflow: hidden; display: flex; flex-direction: column">
    <header style="height: 60px; flex: none; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #1e1c1a">
      <button type="button" aria-label="Open navigation" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #f5f0e8; display: flex; align-items: center; justify-content: center"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg></button>
      <span style="font-size: 17px; font-weight: 600">Library</span>
      <span style="margin-left: auto; width: 36px; height: 36px; margin-right: 4px; border-radius: 50%; background: #242424; border: 1px solid #2a2825; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #e0c272">AB</span>
    </header>

    <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <h1 style="margin: 0; font: 400 32px/1.1 Newsreader, serif; letter-spacing: -0.02em">Your shelf</h1>
        <span style="font-size: 13px; color: #c4bdb0; font-variant-numeric: tabular-nums">1 of 2 books used</span>
      </div>
      <div style="height: 4px; border-radius: 999px; background: #242424"><div style="width: 50%; height: 4px; border-radius: 999px; background: #c9a84c"></div></div>
    </div>

    <section aria-label="Books" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
      <article style="display: flex; gap: 14px; padding: 14px; border-radius: 12px; background: #1a1a1a; border: 1px solid #2a2825">
        <div style="width: 64px; height: 84px; flex: none; box-sizing: border-box; border-radius: 2px 6px 6px 2px; background: #2e2e2e; border-left: 4px solid #3d3a37; padding: 8px 6px; display: flex; align-items: flex-start">
          <span style="font: 500 11px/1.2 Newsreader, serif; color: #f5f0e8">The Prince</span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: rgba(91,155,213,0.12); color: #7fb2e0; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 50%; background: #5b9bd5"></span>Pending</span>
          <span style="font: 500 18px/1.25 Newsreader, serif; margin-top: 4px">The Prince</span>
          <span style="font-size: 13px; color: #c4bdb0">Machiavelli · French · 198 pages</span>
        </div>
      </article>
      <div style="display: flex; gap: 8px; margin-top: -4px">
        <button type="button" style="flex: 1; height: 44px; border: 0; border-radius: 8px; background: #c9a84c; color: #0d0d0d; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>Let Zaydoun read it</button>
        <button type="button" aria-label="More actions for The Prince" style="width: 44px; height: 44px; border: 1px solid #2a2825; border-radius: 8px; background: #1a1a1a; color: #c4bdb0; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
      </div>

      <button type="button" style="margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; border: 1.5px dashed #3d3a37; background: transparent; color: #f5f0e8; text-align: left">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #1a1a1a; color: #e0c272; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">Upload a book</span><span style="font-size: 13px; color: #c4bdb0">1 free slot left · PDF up to 50 MB</span></span>
      </button>
    </section>
  </div>

  <!-- Screen 2: upload sheet -->
  <div style="position: relative; width: 390px; height: 844px; flex: none; background: #0d0d0d; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; padding: 80px 16px; opacity: 0.35">
      <div style="height: 32px; width: 160px; border-radius: 6px; background: #1a1a1a"></div>
      <div style="height: 112px; margin-top: 32px; border-radius: 12px; background: #1a1a1a"></div>
    </div>
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>
    <div role="dialog" aria-labelledby="up-t" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 24px; border-radius: 20px 20px 0 0; background: #2e2e2e; box-shadow: 0 -20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 18px">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3d3a37"></span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span id="up-t" style="font: 500 24px/1.2 Newsreader, serif">Add a book</span>
        <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border: 0; border-radius: 8px; background: transparent; color: #c4bdb0; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: #242424; border: 1px solid rgba(201,168,76,0.3)">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: rgba(201,168,76,0.15); color: #e0c272; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">les-meditations-marc-aurele.pdf</span><span style="font-size: 12px; color: #c4bdb0">8.4 MB · ready to upload</span></span>
        <button type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #e0c272; font-size: 14px; font-weight: 500">Change</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="m-title" style="font-size: 13px; font-weight: 500; color: #c4bdb0">Title</label>
        <input id="m-title" type="text" value="Pensées pour moi-même" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #c9a84c; background: #242424; color: #f5f0e8; font-size: 15px; outline: none; box-shadow: 0 0 0 3px rgba(201,168,76,0.15)">
      </div>
      <div style="display: flex; gap: 12px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
          <label for="m-author" style="font-size: 13px; font-weight: 500; color: #c4bdb0">Author <span style="font-weight: 400">(optional)</span></label>
          <input id="m-author" type="text" placeholder="e.g. Marc Aurèle" style="height: 44px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 8px; border: 1px solid #3d3a37; background: #242424; color: #f5f0e8; font-size: 15px; outline: none">
        </div>
        <div style="width: 132px; display: flex; flex-direction: column; gap: 8px">
          <label for="m-lang" style="font-size: 13px; font-weight: 500; color: #c4bdb0">Language</label>
          <div style="position: relative">
            <select id="m-lang" style="width: 100%; height: 44px; padding: 0 34px 0 14px; border-radius: 8px; border: 1px solid #3d3a37; background: #242424; color: #f5f0e8; font-size: 15px; appearance: none"><option>Français</option><option>English</option><option>العربية</option><option>Español</option><option>中文</option></select>
            <svg class="i" width="16" height="16" viewBox="0 0 24 24" style="position: absolute; right: 12px; top: 14px; color: #c4bdb0; pointer-events: none" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </div>
        </div>
      </div>
      <span style="font-size: 13px; line-height: 1.5; color: #c4bdb0">This uses your last free slot.</span>
      <button type="button" style="height: 52px; border: 0; border-radius: 10px; background: #c9a84c; color: #0d0d0d; font-weight: 600; font-size: 16px">Upload book</button>
    </div>
  </div>
</div>
</body>
</html>
