<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaydoun · Add user</title>
<!-- Zaydoun redesign · static design reference. Not production code: rebuild with Next.js + Tailwind v4 + Lucide (see ../README.md). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>
body{margin:0;background:#0d0d0d}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font:inherit}
button{cursor:pointer}
</style>
</head>
<body>
<div style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: #0d0d0d; color: #f5f0e8; font-family: Inter, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div style="width: 264px; height: 100%; background: #1a1a1a; border-right: 1px solid #2a2825"></div>
    <div style="flex: 1; padding: 40px 48px; display: flex; flex-direction: column; gap: 16px">
      <div style="width: 200px; height: 40px; border-radius: 6px; background: #1a1a1a"></div>
      <div style="height: 44px; width: 420px; border-radius: 8px; background: #1a1a1a; margin-top: 32px"></div>
      <div style="height: 400px; border-radius: 12px; background: #1a1a1a"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.65)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="cu-t" style="position: absolute; left: 50%; top: 120px; width: 520px; margin-left: -260px; box-sizing: border-box; padding: 32px; border-radius: 16px; background: #2e2e2e; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px #3d3a37; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 id="cu-t" style="margin: 0; font: 400 30px/1.15 Newsreader, serif">Add a user</h1>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #c4bdb0">We'll email them a temporary password so they can log in.</p>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin: -8px -8px 0 0; border: 0; border-radius: 8px; background: transparent; color: #c4bdb0; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><label for="cu-n" style="font-size: 13px; font-weight: 500; color: #c4bdb0">Full name</label><input id="cu-n" type="text" value="Nadia El Fassi" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #3d3a37; background: #242424; color: #f5f0e8; font-size: 15px; outline: none"></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><label for="cu-e" style="font-size: 13px; font-weight: 500; color: #c4bdb0">Email</label><input id="cu-e" type="email" value="nadia@" aria-invalid="true" aria-describedby="cu-e-err" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #e05c5c; background: #242424; color: #f5f0e8; font-size: 15px; outline: none"><span id="cu-e-err" style="font-size: 12px; color: #e87878">Enter a full email address.</span></div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="margin-bottom: 10px; font-size: 13px; font-weight: 500; color: #c4bdb0">Role</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; background: rgba(201,168,76,0.12); border: 1px solid #c9a84c; cursor: pointer"><input type="radio" name="cu-role" checked style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #c9a84c"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">Reader</span><span style="font-size: 13px; line-height: 1.4; color: #c4bdb0">Their own library and conversations</span></span></label>
        <label style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; background: #242424; border: 1px solid #3d3a37; cursor: pointer"><input type="radio" name="cu-role" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #c9a84c"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 500">Admin</span><span style="font-size: 13px; line-height: 1.4; color: #c4bdb0">Plus users, usage and costs</span></span></label>
      </div>
    </fieldset>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 8px; border-top: 1px solid #3d3a37">
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #f5f0e8; font-size: 15px; font-weight: 500">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #c9a84c; color: #0d0d0d; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>Add and send invite</button>
    </div>
  </div>

  <div role="status" style="position: absolute; right: 32px; bottom: 32px; width: 380px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #2e2e2e; box-shadow: 0 16px 32px -12px rgba(0,0,0,0.7), 0 0 0 1px #3d3a37">
    <svg class="i" width="20" height="20" viewBox="0 0 24 24" style="color: #4caf7d" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
    <span style="flex: 1; font-size: 14px">Invite sent to omar.t@mail.com <span style="color: #c4bdb0">(toast after success)</span></span>
  </div>
</div>
</body>
</html>
